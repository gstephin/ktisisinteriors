# Static site: nothing to build, publish the repo root.
[build]
  publish = "."
  # A real (no-op) command overrides any build command left in the dashboard;
  # an empty string would not.
  command = "echo 'static site - nothing to build'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
