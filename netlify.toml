# Static site. The build step only copies the site into dist/public, which
# matches the publish directory configured in the Netlify dashboard; it works
# whether or not that dashboard setting is ever cleared.
[build]
  publish = "dist/public"
  command = "rm -rf dist && mkdir -p dist/public && cp -R index.html favicon.svg css js assets dist/public/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
